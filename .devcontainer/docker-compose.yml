version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # Mount the workspace into the container
      - ..:/workspace:cached
      # Use a named volume for node_modules so it stays inside the container
      # and does NOT pollute the host machine
      - node_modules:/workspace/node_modules
    # Keep the container running
    command: sleep infinity
    environment:
      # Tell Vite to bind on all interfaces so port forwarding works
      - VITE_HOST=0.0.0.0
    ports:
      - "5173:5173"   # Vite dev server
      - "4000:4000"   # Firebase Emulator UI
      - "8081:8081"   # Firestore emulator
      - "9099:9099"   # Auth emulator
      - "9199:9199"   # Storage emulator
      - "9150:9150"   # Firestore WebChannel port

volumes:
  # Named volume — node_modules live here, not on the host
  node_modules:
